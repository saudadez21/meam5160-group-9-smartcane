<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartCane live BEV</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #11171d; color: #edf1f5; }
  body { margin: 0; }
  main { max-width: 1000px; padding: clamp(12px, 4vw, 32px); margin: auto; }
  h1 { font-size: clamp(22px, 4vw, 32px); margin: 0 0 10px; }
  .panels { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; color: #c3ccd6; margin-bottom: 6px; }
  .image { aspect-ratio: 960 / 352; background: #202932; border-radius: 8px; overflow: hidden; }
  img { display: block; width: 100%; }
  .status { font-weight: 670; font-size: 18px; margin-bottom: 4px; }
  p { margin-top: 12px; }
  .muted { color: #b8c3ce; font-size: 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; }
  .chip { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
  .tof { margin-top: 24px; }
  .tof h2 { font-size: 19px; margin: 0 0 4px; }
  .tof p { margin: 0 0 8px; }
  .tof-grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; max-width: 440px; }
  .tof-cell {
    display: grid; place-items: center; min-height: clamp(25px, 6vw, 38px);
    border-radius: 4px; background: #202932; color: #aeb9c4;
    font-size: clamp(10px, 2.8vw, 14px); font-variant-numeric: tabular-nums;
  }
  .tof-cell.valid { background: #193b3d; color: #ccebea; }
  .tof-cell.tentative { background: #4a361e; color: #ffe0a1; }
</style>
</head>
<body>
<main>
  <h1>SmartCane live BEV</h1>
  <div class="panels"><span>Camera segmentation</span><span>Ground view</span></div>
  <div class="image"><img id="preview" alt="Live segmentation and bird's-eye view"></div>
  <p id="status" class="status">Waiting for the first frame...</p>
  <p id="metrics" class="muted"></p>
  <div class="legend muted">
    <span><i class="chip" style="background:#00c800"></i>Walkable</span>
    <span><i class="chip" style="background:#c800c8"></i>Road</span>
    <span><i class="chip" style="background:#ff0000"></i>Obstacle</span>
    <span><i class="chip" style="background:#323232"></i>Unknown</span>
  </div>
  <section id="tof-panel" class="tof" hidden>
    <h2>ToF distances</h2>
    <p class="muted">View from in front of the cane, facing the sensor.</p>
    <p id="tof-status" class="muted"></p>
    <div id="tof-grid" class="tof-grid" role="group" aria-label="8 by 8 distance grid"></div>
  </section>
</main>
<script>
  const preview = document.getElementById('preview');
  const status = document.getElementById('status');
  const metrics = document.getElementById('metrics');
  const tofPanel = document.getElementById('tof-panel');
  const tofStatus = document.getElementById('tof-status');
  const tofCells = Array.from({length: 64}, () => {
    const cell = document.createElement('span');
    cell.className = 'tof-cell';
    return cell;
  });
  document.getElementById('tof-grid').append(...tofCells);
  let sequence = null;
  let imageURL = null;
  const value = (number, digits) => number === null ? '-' : number.toFixed(digits);

  function renderToF(sample) {
    tofPanel.hidden = !sample;
    if (!sample) return;
    const ready = sample.state === 'ready';
    const messages = {
      waiting: 'Waiting for ToF data...',
      stale: 'No recent ToF data.',
      disconnected: 'ToF preview interrupted.',
      error: `ToF unavailable. ${sample.message}`,
    };
    tofStatus.textContent = ready ? 'Millimeters  |  ? Tentative  |  -- Unknown' : messages[sample.state];
    tofCells.forEach((cell, index) => {
      const row = Math.floor(index / 8);
      const column = index % 8;
      const distance = ready ? sample.distances_mm[row][column] : null;
      const tentative = distance !== null && sample.tentative[row][column];
      cell.textContent = distance === null ? '--' : `${distance}${tentative ? '?' : ''}`;
      cell.classList.toggle('valid', distance !== null && !tentative);
      cell.classList.toggle('tentative', tentative);
    });
  }

  async function refresh() {
    let state;
    try {
      const reply = await fetch('status');
      if (!reply.ok) throw new Error();
      state = await reply.json();
      renderToF(state.tof);
      if (state.sequence !== null && state.sequence !== sequence) {
        const image = await fetch(`preview/${state.sequence}`);
        if (!image.ok) throw new Error();
        const nextURL = URL.createObjectURL(await image.blob());
        preview.src = nextURL;
        if (imageURL) URL.revokeObjectURL(imageURL);
        imageURL = nextURL;
        sequence = state.sequence;
        status.textContent = state.pose_status === 'matched' ? state.decision : `BEV unknown: ${state.pose_status}`;
        metrics.textContent = `Pitch ${value(state.pitch_deg, 1)} deg | roll ${value(state.roll_deg, 1)} deg | ` +
          `height ${value(state.height_m, 2)} m | IMU match ${value(state.imu_nearest_ms, 1)} ms | ` +
          `inference ${value(state.infer_ms, 0)} ms | L/C/R ${value(state.left, 2)} / ` +
          `${value(state.center, 2)} / ${value(state.right, 2)}`;
      }
    } catch {
      sequence = null;
      status.textContent = 'Preview interrupted. Reconnecting...';
      metrics.textContent = '';
      if (!state && !tofPanel.hidden) renderToF({state: 'disconnected'});
    }
    setTimeout(refresh, 1000);
  }
  refresh();
</script>
</body>
</html>
