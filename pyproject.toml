[project]
name = "meam5160-group-9-smartcane"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "opencv-python>=5.1.0.95",
]

[project.optional-dependencies]
imu = [
    "gpiod>=2.6 ; sys_platform == 'linux'",
    "spidev>=3.8 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "smartcane"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "I",   # isort
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
